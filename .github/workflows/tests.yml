name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Install (engine + GUI + test deps)
        run: |
          pip install -r requirements.txt -r requirements-gui.txt pytest
      - name: Linux headless Qt deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0
      - name: Run test suite (engine + offscreen GUI)
        env: { QT_QPA_PLATFORM: offscreen }
        run: pytest tests/ -q
