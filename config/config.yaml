# =============================================================================
# Slipstream / cfdauto — Master configuration
# =============================================================================
# Tuned for:
#   - ANSYS Student 2026 R1 (v261)
#   - Wing project at C:\Users\tejas\Desktop\CFD_Auto\wing_project\
# Every setting here has been validated by real runs.
# =============================================================================

# ─── ANSYS installation paths ─────────────────────────────────────────────────
ansys:
  version: "261"                                      # 2026 R1 = v261
  awp_root: "C:/Program Files/ANSYS Inc/ANSYS Student/v261"
  runwb2: "C:/Program Files/ANSYS Inc/ANSYS Student/v261/Framework/bin/Win64/RunWB2.exe"

# ─── Workbench (geometry + mesh) ──────────────────────────────────────────────
workbench:
  project_file: "C:/Users/tejas/Desktop/CFD_Auto/wing_project/wing_study.wbpj"
  system_name: "FFF"                                  # from `python main.py wb-info`
  aoa_parameter: "P1"                                 # from `python main.py wb-info`
  aoa_expression: "{value} [degree]"
  aoa_scale: -1.0                                     # ← flips inverted DM rotation.
                                                      # Excel: +8° → WB: -8° internally.
                                                      # Use natural POSITIVE angles now!
  update_geometry: true
  refresh_setup: true                                 # writes Fluent transfer mesh
  save_project: true
  mesh_file_glob: ""                                  # auto-discovers MESH/, MECH/, Fluent/
  timeout_s: 3600

# ─── Fluent (solver) ──────────────────────────────────────────────────────────
fluent:
  baseline_case: "C:/Users/tejas/Desktop/CFD_Auto/wing_project/baseline.cas.h5"
  dimension: 3
  precision: "double"
  processor_count: 4                                  # Student cap: max 4 cores
  product_version: "26.1.0"                           # MUST match ansys.version
  ui_mode: "no_gui"                                   # headless; use "gui" only for debug
  launch_timeout_s: 900                               # was 600 - increased for stability

  inlet_zone: "inlet"
  inlet_type: "velocity_inlet"
  wall_zones: ["wing"]

  aoa_method: "geometry"                              # rotates wing via WB parameter
  base_flow_axis: "+x"
  base_lift_axis: "+y"

  # Save contour + mesh + geometry PNGs after each case (experimental, non-fatal)
  capture_images: true                                # 4 images per case in artifact folder

  # Reference values for CL/CD normalization
  reference:
    density: 1.225                                    # kg/m³  (sea level air)
    viscosity: 1.7894e-05                             # kg/(m·s)
    area: 1.0                                         # m²  ← REPLACE with your real planform area
    length: 1.0                                       # m   ← REPLACE with your real chord
    depth: 1.0                                        # m   (2D only; harmless in 3D)
    temperature: 288.16                               # K
    pressure: 0.0                                     # Pa gauge

# ─── Solver behaviour ─────────────────────────────────────────────────────────
solve:
  max_iterations: 1500                                 # was 1500 - don't waste time on stalls
  check_interval: 100                                 # iterate in 100-step chunks
  min_iterations: 300
  convergence_window: 50                              # trailing samples for flatness check
  cl_tolerance: 1.0e-3
  cd_tolerance: 1.0e-4
  initialization: "hybrid"                            # hybrid | standard
  accept_unconverged: true                            # write results even if not converged
  save_case_data: false                               # true = ~200 MB per case (disk-heavy)
  crosscheck_tolerance: 0.03                          # 3% CL·q·A vs Lift force check

# ─── Excel schedule + result ledger ───────────────────────────────────────────
excel:
  file: "C:/Users/tejas/Desktop/CFD_Auto/wing_project/experiments.2.xlsx"
  sheet: "Experiments"
  header_row: 1
  save_retries: 10                                    # Excel open? retry N times
  save_retry_wait_s: 6                                # 6s between retries

  columns:
    aoa:        "AOA_deg"
    velocity:   "Velocity_m_s"
    status:     "Status"
    cl:         "CL"
    cd:         "CD"
    cl_cd:      "CL/CD"
    lift:       "Lift_N"
    drag:       "Drag_N"
    fl_fd:      "FL/FD"
    iterations: "Iterations"
    converged:  "Converged"
    error:      "Error"
    started:    "Started"
    finished:   "Finished"
    duration:   "Duration_min"
    case_dir:   "CaseDir"

# ─── Runtime behaviour ────────────────────────────────────────────────────────
runtime:
  work_dir: "runs"                                    # meshes, logs, per-case artifacts
  retries_per_case: 0                                 # was 1 - don't waste 20 min on retries
  stop_on_failure: false                              # continue batch even if one case fails
  reuse_mesh_per_geometry: true                       # cache meshes per unique AOA
  rerun_stale_running: true                           # re-queue RUNNING rows from crashed runs
  mock: false                                         # ← toggle to true for demo mode